name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode optional signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOOLHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > signing.jks
          fi

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        env:
          TOOLHUB_KEYSTORE_FILE: ${{ secrets.TOOLHUB_KEYSTORE_BASE64 != '' && 'signing.jks' || '' }}
          TOOLHUB_KEYSTORE_PASSWORD: ${{ secrets.TOOLHUB_KEYSTORE_PASSWORD }}
          TOOLHUB_KEY_ALIAS: ${{ secrets.TOOLHUB_KEY_ALIAS }}
          TOOLHUB_KEY_PASSWORD: ${{ secrets.TOOLHUB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolhub-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
