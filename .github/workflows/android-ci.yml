name: Android CI & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode optional signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TOOLHUB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > signing.jks
          fi

      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build Release APK
        env:
          TOOLHUB_KEYSTORE_FILE: ${{ secrets.TOOLHUB_KEYSTORE_BASE64 != '' && 'signing.jks' || '' }}
          TOOLHUB_KEYSTORE_PASSWORD: ${{ secrets.TOOLHUB_KEYSTORE_PASSWORD }}
          TOOLHUB_KEY_ALIAS: ${{ secrets.TOOLHUB_KEYSTORE_ALIAS }}
          TOOLHUB_KEY_PASSWORD: ${{ secrets.TOOLHUB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: toolhub-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Generate Release Notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)
          TAG_MSG=$(git tag -l --format='%(contents)' "${TAG}" | sed '/^[[:space:]]*$/d')
          {
            echo "## ToolHub ${TAG}"
            echo ""
            if [ -n "${TAG_MSG}" ]; then
              echo "### 发布说明"
              echo "${TAG_MSG}"
              echo ""
            fi
            echo "### 更新内容"
            if [ -n "${PREV_TAG}" ]; then
              git log "${PREV_TAG}..${TAG}" --no-merges --pretty=format:"- %s (%h)"
            else
              git log -n 20 --no-merges --pretty=format:"- %s (%h)"
            fi
            echo ""
            echo ""
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/${TAG}"
            fi
          } > release_notes.md

      - name: Create GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          body_path: release_notes.md

      - name: Sync code & tag to Gitee
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'qytech/ToolHub' }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set; skipping Gitee mirror."
            exit 0
          fi
          git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" HEAD:refs/heads/main
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            git push --force "https://oauth2:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git" "refs/tags/${GITHUB_REF_NAME}"
          fi

      - name: Create Gitee Release & upload APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: ${{ secrets.GITEE_REPO || 'qytech/ToolHub' }}
        run: |
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN not set; skipping Gitee release."
            exit 0
          fi
          TAG="${GITHUB_REF_NAME}"
          APK_FILE=$(ls -1 app/build/outputs/apk/release/*.apk | head -n1)
          BODY=$(cat release_notes.md)
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"access_token": os.environ["GITEE_TOKEN"], "tag_name": os.environ["TAG"], "name": f"ToolHub {os.environ[\"TAG\"]}", "body": os.environ["BODY"], "prerelease": False, "target_commitish": "main"}))' TAG="$TAG" BODY="$BODY")
          RESP=$(curl -sS -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          REL_ID=$(python3 -c 'import json,sys; d=json.loads(sys.argv[1]); print(d.get("id",""))' "$RESP")
          if [ -z "$REL_ID" ]; then
            echo "Gitee create release response: $RESP"
            exit 1
          fi
          curl -sS -f -X POST "https://gitee.com/api/v5/repos/${GITEE_REPO}/releases/${REL_ID}/attach_files" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "file=@${APK_FILE}" >/dev/null
          echo "Uploaded ${APK_FILE} to Gitee Release ${TAG} (id=${REL_ID})"
